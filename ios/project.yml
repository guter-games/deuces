name: Deuces
options:
  bundleIdPrefix: com.deuces
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CURRENT_PROJECT_VERSION: 6
    MARKETING_VERSION: "1.0"
    # Plant Chess Studios, LLC
    DEVELOPMENT_TEAM: U253FJED45
    CODE_SIGN_STYLE: Automatic
    # Xcode's debug dylib stub breaks Messages extensions on iPadOS 16.
    ENABLE_DEBUG_DYLIB: NO
packages:
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift
    from: "16.0.0"
targets:
  DeucesCore:
    type: framework
    platform: iOS
    sources:
      - DeucesCore
    dependencies:
      - package: SocketIO
        product: SocketIO
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deuces.deuces.imessage.core
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        APPLICATION_EXTENSION_API_ONLY: YES

  DeucesCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - DeucesCoreTests
    dependencies:
      - target: DeucesCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deuces.deuces.imessage.core.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: ""

  # Standalone iMessage container: assets only (no home-screen UI / no Swift).
  # Product type must be application.messages — not application.
  # ASC primary bundle ID is this container id.
  Deuces:
    type: application.messages
    platform: iOS
    sources:
      - path: Deuces
        excludes:
          - "**/*.swift"
    dependencies:
      - target: DeucesCore
        embed: true
        codeSign: true
      - target: DeucesMessages
        embed: true
    info:
      path: Deuces/Info.plist
      properties:
        CFBundleDisplayName: Deuces With Friends
        # ASC requires APPL even for application.messages (standalone).
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deuces.deuces.imessage
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon


  DeucesMessages:
    # Must be messages-specific so actool gets --stickers-icon-role extension
    # (generic app-extension omits iMessage icon PNGs from the appex).
    type: app-extension.messages
    platform: iOS
    sources:
      - DeucesMessages
    dependencies:
      # Link only — container embeds DeucesCore (Messages forbids nested Frameworks).
      - target: DeucesCore
        embed: false
        link: true
    info:
      path: DeucesMessages/Info.plist
      properties:
        CFBundleDisplayName: Deuces With Friends
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        MSMessagesExtensionStoreIconName: iMessage App Icon
        NSExtension:
          NSExtensionPointIdentifier: com.apple.message-payload-provider
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MessagesViewController
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    settings:
      base:
        # Must be a child of the ASC/container id.
        PRODUCT_BUNDLE_IDENTIFIER: com.deuces.deuces.imessage.extension
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: "iMessage App Icon"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"

  # Local-only harness for `make ios-screenshots` (not shipped).
  DeucesScreenshot:
    type: application
    platform: iOS
    sources:
      - DeucesScreenshot
      - path: Deuces/Assets.xcassets
    dependencies:
      - target: DeucesCore
        embed: true
        codeSign: true
    info:
      path: DeucesScreenshot/Info.plist
      properties:
        CFBundleDisplayName: Deuces Screenshots
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deuces.deuces.imessage.screenshot
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  Deuces:
    build:
      targets:
        Deuces: all
        DeucesCore: all
        DeucesMessages: all
    test:
      targets:
        - DeucesCoreTests
  DeucesCore:
    build:
      targets:
        DeucesCore: all
    test:
      targets:
        - DeucesCoreTests
  DeucesScreenshot:
    build:
      targets:
        DeucesScreenshot: all
        DeucesCore: all
