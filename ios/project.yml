name: Deuces
options:
  bundleIdPrefix: com.deuces
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CURRENT_PROJECT_VERSION: 3
    MARKETING_VERSION: "1.0"
    # Plant Chess Studios, LLC
    DEVELOPMENT_TEAM: U253FJED45
    CODE_SIGN_STYLE: Automatic
    # Xcode's debug dylib stub breaks Messages extensions on iPadOS 16.
    ENABLE_DEBUG_DYLIB: NO
packages:
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift
    from: "16.0.0"
targets:
  DeucesCore:
    type: framework
    platform: iOS
    sources:
      - DeucesCore
    dependencies:
      - package: SocketIO
        product: SocketIO
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deuces.deuces.core
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        APPLICATION_EXTENSION_API_ONLY: YES

  DeucesCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - DeucesCoreTests
    dependencies:
      - target: DeucesCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deuces.deuces.core.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: ""

  Deuces:
    type: application
    platform: iOS
    sources:
      - Deuces
    dependencies:
      - target: DeucesCore
        embed: true
        codeSign: true
      - target: DeucesMessages
        embed: true
    info:
      path: Deuces/Info.plist
      properties:
        CFBundleDisplayName: Deuces
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deuces.deuces
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  DeucesMessages:
    # Must be messages-specific so actool gets --stickers-icon-role extension
    # (generic app-extension omits iMessage icon PNGs from the appex).
    type: app-extension.messages
    platform: iOS
    sources:
      - DeucesMessages
    dependencies:
      # Link only — host app embeds DeucesCore (Messages forbids nested Frameworks).
      - target: DeucesCore
        embed: false
        link: true
    info:
      path: DeucesMessages/Info.plist
      properties:
        CFBundleDisplayName: Deuces
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        MSMessagesExtensionStoreIconName: iMessage App Icon
        NSExtension:
          NSExtensionPointIdentifier: com.apple.message-payload-provider
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MessagesViewController
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    settings:
      base:
        # `.messages` is already taken globally; suffix must still be under the host id.
        PRODUCT_BUNDLE_IDENTIFIER: com.deuces.deuces.imessage
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: "iMessage App Icon"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
schemes:
  Deuces:
    build:
      targets:
        Deuces: all
        DeucesCore: all
        DeucesMessages: all
    test:
      targets:
        - DeucesCoreTests
  DeucesCore:
    build:
      targets:
        DeucesCore: all
    test:
      targets:
        - DeucesCoreTests
